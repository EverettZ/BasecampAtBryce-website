[build]
  command = 'SITE_URL="${SITE_URL:-$URL}" npm run build && npm run check:content'
  publish = "dist"

[build.environment]
  NODE_VERSION = "26.13.1"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
